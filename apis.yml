name: Cloudcoreo
description: >-
  CloudCoreo was a Seattle-based cloud security startup (founded 2016, seed
  round led by Madrona Venture Group) that built a cloud configuration and
  vulnerability-assessment platform to identify and remediate misconfigurations
  across public multi-cloud environments (AWS, Azure, GCP). VMware acquired
  CloudCoreo in February 2018 and folded the team and product into VMware Cloud
  Services, where it became the basis of CloudHealth Secure State. The
  standalone CloudCoreo service and developer surface have since been retired:
  cloudcoreo.com is now a parked/for-sale domain and there is no live public
  API. The CloudCoreo GitHub organization remains, hosting the now-deprecated
  first-party CLI. This profile is a historical/lineage record, not an active
  API provider.
